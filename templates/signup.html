{% extends 'base.html' %}{% block title %}Create account | AI Smart Farming{% endblock %}
{% block auth_content %}<div class="auth-card"><p class="eyebrow green">JOIN THE FARMER PORTAL</p><h2>Create your account</h2><p class="muted">Register to manage your farms and crop records.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name</label><input name="full_name" required maxlength="100" autocomplete="name"><label>Email address</label><input type="email" name="email" required maxlength="150" autocomplete="email"><label>Phone number</label><input name="phone" maxlength="25" autocomplete="tel"><label>Password</label><input type="password" name="password" minlength="8" required autocomplete="new-password"><button class="primary-button">Create farmer account</button></form><p class="switch-link">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
