<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | Smart Farming</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <nav aria-label="Main navigation">
    <a class="brand" href="{{ url_for('index') }}">Smart Farming</a>
    {% if g.user %}
      {% if not g.user.is_admin %}
      <a href="{{ url_for('farms.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('farms.farm_list') }}">Farms</a>
      {% endif %}
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="secondary">Sign out</button>
      </form>
    {% endif %}
  </nav>
</header>
<main>
  {% block context %}{% endblock %}
  <h1>{{ title }}</h1>
  {% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
