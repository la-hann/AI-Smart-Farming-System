{% extends "base.html" %}
{% block content %}
<div class="stats">
  {% for label, count in counts.items() %}
  <div class="panel stat"><span>{{ label }}</span><strong>{{ count }}</strong></div>
  {% endfor %}
</div>
{% if not g.user.is_admin %}
<section class="panel">
  <div class="section-heading"><h2>Your farms</h2><a href="{{ url_for('farms.farm_list') }}">Manage farms</a></div>
  {% include "farm_links.html" %}
</section>
{% endif %}
{% endblock %}
